<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CGPA Calculator - BTech Project</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>CGPA Calculator</h1>
        <p>Calculate your GPA and CGPA for BTech courses</p>
        
        <div class="semester-section">
            <h2>Add Semester</h2>
            <form id="semesterForm">
                <label for="semesterName">Semester Name:</label>
                <input type="text" id="semesterName" placeholder="e.g., Semester 1" required>
                
                <div id="subjectsContainer">
                    <div class="subject">
                        <input type="text" placeholder="Subject Name" class="subjectName" required>
                        <input type="number" placeholder="Credits" class="credits" min="1" required>
                        <select class="grade" required>
                            <option value="">Grade</option>
                            <option value="10">O (10)</option>
                            <option value="9">A+ (9)</option>
                            <option value="8">A (8)</option>
                            <option value="7">B+ (7)</option>
                            <option value="6">B (6)</option>
                            <option value="5">C (5)</option>
                            <option value="4">P (4)</option>
                            <option value="0">F (0)</option>
                        </select>
                        <button type="button" class="removeSubject">Remove</button>
                    </div>
                </div>
                <button type="button" id="addSubject">Add Subject</button>
                <button type="submit">Calculate GPA</button>
            </form>
        </div>
        
        <div class="results">
            <h2>Results</h2>
            <div id="semestersList"></div>
            <div id="cgpaResult"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
